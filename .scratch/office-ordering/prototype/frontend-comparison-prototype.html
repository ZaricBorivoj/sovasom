<div class="proto-banner">THROWAWAY PROTOTYPE · Sample shops, prices, times and behavior · Nothing is saved</div><div id="app"></div><div id="switcher"></div>
<script>
const names={A:'Café · The counter',D:'Café · The daily journal',C:'Social · Postcard club',E:'Social · Office lounge'};
const variants=['A','D','C','E'];
const menu=[{id:'flat',shop:'Kiosk Coffee',name:'Flat white',detail:'Double espresso · dairy milk',price:320},{id:'iced',shop:'Kiosk Coffee',name:'Iced latte',detail:'Espresso · milk · ice',price:350},{id:'espresso',shop:'Kiosk Coffee',name:'Espresso',detail:'Double shot',price:230},{id:'croissant',shop:'Morning Bakery',name:'Butter croissant',detail:'Baked this morning',price:240},{id:'roll',shop:'Morning Bakery',name:'Cinnamon roll',detail:'Cinnamon · vanilla glaze',price:290}];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let screen='runs',quantities={},submitted={},allCollected=false,announced=null,message='',closingMinutes=20;
if(new URLSearchParams(location.search).get('variant')!==variant){let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);}
const money=n=>n.toLocaleString('en')+' RSD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people='<div class="facepile" aria-label="Mila, Luka, Ana and four others"><span class="avatar">ML</span><span class="avatar">LK</span><span class="avatar">AN</span></div>';
const dayLabel=d=>d.toLocaleDateString('en-GB',{weekday:'long'});
function generatedTitle(d=new Date()){const hour=d.getHours(),period=hour<12?'morning':hour<18?'afternoon':'evening';const joke={morning:'Grounds for optimism',afternoon:'Crumbs of motivation',evening:'Better latte than never'}[period];return dayLabel(d)+' '+period+' · '+joke;}
const primaryRun={name:generatedTitle(),person:'Mila',initials:'ML',minutes:20,count:'7 colleagues joining'};
const nextRun={name:generatedTitle(new Date(new Date().setHours(15,0,0,0))),person:'Luka',initials:'LK',minutes:45,count:'3 colleagues joining'};
const shopNames='Kiosk Coffee + Morning Bakery';
function runLabel(r){return `<span class="eyebrow">${esc(r.person)} is making a run</span><h2>${esc(r.name)}</h2><p class="muted">${shopNames}</p>`}
function receiptRun(r){return `<article class="receipt-row"><div class="row between"><span class="eyebrow">${esc(r.person)}’s run</span><span class="pill">Closes in ${r.minutes} min</span></div><h3>${esc(r.name)}</h3><small>${shopNames}</small><button class="primary" data-screen="menu">Choose your items ↗</button></article>`}
function runs(){if(variant==='A')return `<div class="counter-grid"><article class="counter-special"><span class="eyebrow">On the counter today · Mila’s run</span><div class="cup" aria-hidden="true"></div><h2>${esc(primaryRun.name)}</h2><div style="font-size:13px">${shopNames}</div><div class="counter-time">20<small> min to join</small></div><button class="primary" data-screen="menu">A coffee? A pastry? Count me in ↗</button><small style="color:#dadfcf">7 colleagues are already in</small></article><div class="stack"><section class="receipt"><div class="row between"><span class="eyebrow">The office receipt</span><span aria-hidden="true">✳</span></div>${receiptRun(nextRun)}<div class="receipt-row"><h3>Two stops. Plenty of good things.</h3><p class="muted">Every run visits the coffee shop and the bakery. Just choose what you fancy.</p></div><p class="caption muted" style="margin-top:20px">No payment faff here. Settle up outside the app.</p></section><aside class="note"><span class="eyebrow">Your turn to bring the good stuff?</span><p>Pick how many minutes the office has to join.<br>We’ll take care of the name.</p><button class="secondary" style="margin-top:18px" data-screen="announce">I’m heading out +</button></aside></div></div>`;
if(variant==='D')return `<div class="journal-layout"><aside class="journal-margin"><span class="eyebrow">Office edition</span><div class="journal-date">${new Date().getDate()}</div><p>${new Date().toLocaleDateString('en-GB',{month:'long',weekday:'long'})}</p><p class="muted" style="margin-top:25px;font:italic 19px Georgia">Small trips.<br>Good company.</p></aside><section>${[primaryRun,nextRun].map((r,i)=>`<article class="journal-entry"><div class="journal-index">0${i+1}</div><div><span class="eyebrow">${r.person} is heading out · ${r.count}</span><h2 style="margin-top:13px">${esc(r.name)}</h2><p class="muted">${shopNames}</p><span class="pill">Closes in ${r.minutes} minutes</span></div><div class="journal-action"><button class="primary" data-screen="menu">Choose your items ↗</button></div></article>`).join('')}<div style="padding:24px 0"><span class="eyebrow">A note from the office</span><p class="muted" style="margin-top:12px;max-width:540px">Every run makes both stops. A coffee, a pastry, or a little of each — your choice.</p></div></section></div>`;
if(variant==='C')return `<div class="postcard-grid">${[primaryRun,nextRun].map((r,i)=>`<article class="postcard">${i===0?'<div class="postcard-art" aria-hidden="true">☕ ✳</div>':''}<div class="row between"><span class="eyebrow">From ${r.person}, with caffeine</span><span class="stamp">${r.minutes} MIN<br>TO JOIN</span></div><h2>${esc(r.name)}</h2><p>${shopNames}</p><div class="row between">${people}<span class="caption">${r.count}</span></div><button class="primary" data-screen="menu">${i===0?'Yes please! Choose items ↗':'Save me something ↗'}</button></article>`).join('')}<aside class="postcard-aside"><div class="row between"><h3>Do a little run.<br>Get a lot of love.</h3><span style="font-size:40px" aria-hidden="true">♡</span></div><p style="margin-top:12px">Coffee shop + bakery. Always both.</p><button class="secondary" style="margin-top:18px" data-screen="announce">I’ll be the runner +</button></aside></div>`;
return `<div class="chat-layout"><section class="conversation"><div class="chat-day">${dayLabel(new Date())} · the coffee corner</div>${[primaryRun,nextRun].map((r,i)=>`<article class="chat-message"><span class="avatar">${r.initials}</span><div><div class="row" style="margin-bottom:9px"><b>${r.person}</b><small>Runner</small></div><div class="bubble"><h2>${esc(r.name)}</h2><p>I’m doing both stops. Anyone fancy a little something?</p><small>${shopNames}</small><div class="row between"><span class="pill">Closes in ${r.minutes} min</span><small>${i?3:7} joining</small></div><button class="primary" data-screen="menu">${i?'I’m in too ↗':'Count me in ↗'}</button></div>${i===0?'<p class="caption muted" style="margin:9px 0 0 12px">Ana, Luka + 5 others are in · good taste, team.</p>':''}</div></article>`).join('')}<button class="secondary" data-screen="announce" style="text-align:left;padding:20px 24px">+ Tell the office you’re heading out…</button></section><aside class="chat-aside"><span class="eyebrow">The usual suspects</span><h2 style="margin:14px 0 22px;font-size:26px">A little office ritual.</h2>${people}<p class="muted" style="margin-top:14px;font-size:13px">18 colleagues.<br>One very well-caffeinated office.</p><div class="chat-note"><b>Both stops. Every time.</b><p style="margin-top:10px;font-size:13px">Coffee from Kiosk.<br>Pastries from Morning Bakery.<br>You just choose your favourites.</p></div></aside></div>`}
function menuView(){return `<div class="sectionline"><div><h2>${esc(primaryRun.name)}</h2><p class="muted" style="margin-top:8px">Mila’s run · Closes in 20 min · Both shops</p></div></div><div class="menu-layout"><div>${['Kiosk Coffee','Morning Bakery'].map(shop=>`<section class="menu-shop"><h3>${shop}</h3>${menu.filter(m=>m.shop===shop).map(m=>`<div class="menu-item"><div><b>${m.name}</b><br><small>${m.detail}</small><p style="margin-top:5px;font-size:13px">${money(m.price)}</p></div><div class="qty"><button aria-label="Remove ${m.name}" data-qty="${m.id}" data-delta="-1" ${!quantities[m.id]?'disabled':''}>−</button><output aria-label="${m.name} quantity">${quantities[m.id]||0}</output><button aria-label="Add ${m.name}" data-qty="${m.id}" data-delta="1">+</button></div></div>`).join('')}</section>`).join('')}</div><aside class="card summary"><span class="eyebrow">For Mila to collect</span><h3 style="margin-top:12px">Your request</h3>${menu.filter(m=>quantities[m.id]).map(m=>`<div class="summary-line"><span>${quantities[m.id]} × ${m.name}</span><b>${money(quantities[m.id]*m.price)}</b></div>`).join('')||'<p class="muted">Pick something from the shop menus.</p>'}<div class="summary-line" style="border-top:1px solid var(--line);padding-top:16px"><b>Estimated total</b><b>${money(menu.reduce((t,m)=>t+(quantities[m.id]||0)*m.price,0))}</b></div><button class="primary" id="send" style="width:100%;margin-top:12px" ${!Object.values(quantities).some(Boolean)?'disabled':''}>Send request</button><div class="notice">Payment happens outside the app.</div><p><small>Illustrative: fixed menu items, quantities and prices. Options, edits and cut-off rules are still undecided.</small></p></aside></div>`}
function announce(){return `<div class="form-shell card"><h2>You do the run. We do the naming.</h2><p class="muted">Both shops are on the route. How long does the office have to join?</p><form id="announce-form" class="stack" style="margin-top:26px"><div class="generated-title"><span class="eyebrow">Your automatically named run</span><h3>${esc(generatedTitle())}</h3><small>Day + time of day + a little coffee nonsense. No typing needed.</small></div><div class="notice" style="margin:0"><b>Two stops, every time</b><br>${shopNames}</div><label for="closing-minutes">Close requests in how many minutes?</label><div class="duration-input"><input id="closing-minutes" name="minutes" type="number" min="1" max="180" step="1" value="${closingMinutes}" required aria-describedby="duration-help"><span>minutes from now</span></div><div class="minute-presets" aria-label="Quick closing durations">${[10,15,20,30].map(n=>`<button type="button" data-minutes="${n}" aria-pressed="${closingMinutes===n}">${n} min</button>`).join('')}</div><p id="duration-help" class="form-feedback">Sample default: 20 minutes. The accepted range and timing rules are still illustrative.</p><button class="primary" type="submit">Announce to the office ↗</button><small>Preview only. No notifications are sent.</small></form></div>`}
function shopping(){let items=[{id:'base-flat',shop:'Kiosk Coffee',name:'Flat white',qty:3,for:'Mila × 1 · Ana × 2'},{id:'base-iced',shop:'Kiosk Coffee',name:'Iced latte',qty:1,for:'Luka × 1'},{id:'base-croissant',shop:'Morning Bakery',name:'Butter croissant',qty:4,for:'Mila × 1 · Ana × 1 · Luka × 2'},...menu.filter(m=>submitted[m.id]).map(m=>({...m,id:'you-'+m.id,qty:submitted[m.id],for:'You × '+submitted[m.id]}))];const total=items.reduce((a,i)=>a+i.qty,0);return `<div class="sectionline"><div><h2>Everything to bring back</h2><p class="muted" style="margin-top:8px">Runner preview · ${esc(primaryRun.name)}</p></div><span class="pill">2 shops · ${total} items</span></div><div class="collection-summary ${allCollected?'collection-done':''}"><div><h3 class="collection-heading">${allCollected?'All collected. Nice one!':'Coffee? Check. Pastries? Check.'}</h3><p>${allCollected?'Everything on this list is marked as collected.':'Glance through both shop lists, then mark everything in one go.'}</p></div><button class="primary" id="collect-all" ${allCollected?'disabled':''}>${allCollected?'✓ Everything collected':'✓ Mark everything collected'}</button></div><div class="shop-list ${allCollected?'all-collected':''}">${['Kiosk Coffee','Morning Bakery'].map(shop=>`<section class="card"><span class="eyebrow">Shop stop</span><h2 style="margin:12px 0">${shop}</h2>${items.filter(i=>i.shop===shop).map(i=>`<div class="shopping-row"><div class="item-name"><b>${i.name}</b><span class="item-count">× ${i.qty}</span></div><small>${i.for}</small></div>`).join('')}</section>`).join('')}</div><p class="notice">One action confirms the entire run is collected. Unavailable items, corrections and returning to the office will be explored in the lifecycle discussion.</p>`}
function assumptions(){return `<section class="card help"><h2>Round two · more character, less dashboard</h2><p>Two warm café examples and two playful social examples. The clean office utility style has been removed.</p><dl><dt>A · The counter / warm café</dt><dd>An arched café special, bold closing duration, and a paper receipt for the next run. Deep green, butter yellow, serif headings.</dd><dt>D · The daily journal / warm café</dt><dd>A typographic office journal with dated margins and numbered run entries. Warm paper, quiet rules, open spacing.</dd><dt>C · Postcard club / playful social</dt><dd>Oversized colourful postcards, playful stamps, friendly invitations. Peach, lavender and soft green with chunky borders.</dd><dt>E · Office lounge / playful social</dt><dd>A conversational feed with runner portraits and invitation bubbles. Warm coral, soft lavender, rounded controls. This explores visual presentation; there is no chat feature.</dd></dl><h3>Your feedback, applied everywhere</h3><p>Every run visits both shops. Titles are generated with a day, a time of day and a joke. Runners choose a closing duration in minutes. One click marks everything collected; there are no item checkboxes.</p><p>Sample shops, people, RSD prices, menu options, 20-minute default, 1–180 minute range, exact jokes and time-of-day boundaries are illustrative. Sample run countdowns are fixed for comparison, not live timers. Times and generated titles use this browser’s local clock; production timezone policy is undecided.</p><p>All run cards open the same representative menu flow. Changes live in memory and reset on reload. No backend, accounts, chat, payment or notifications are connected.</p><p>Production proposal: shared tokens, accessible React primitives and Storybook. The direction and component-library choice remain open.</p></section>`}
function render(){const isWarm=variant==='A'||variant==='D';document.body.className={A:'warm counter',D:'warm journal',C:'social postcards',E:'social chat'}[variant];const title=screen==='runs'?{A:'A little trip. A lovely haul.',D:'The Daily Grind.',C:'Good things come in runs.',E:'Coffee tastes better together.'}[variant]:screen==='menu'?'A little something for you.':screen==='announce'?'Heading out?':screen==='shopping'?'The shopping list.':'Behind the preview.';const subtitle=screen==='runs'?{A:'Fresh coffee. Flaky pastries. Very happy colleagues.',D:'Today’s office rituals, hot off the press.',C:'Two stops. One office. Excellent taste.',E:'See who’s heading out. Add your little pick-me-up.'}[variant]:'';const state={variant:names[variant],screen,requestDraft:quantities,submittedRequest:submitted,allCollected,closingMinutes,announcedRun:announced};document.getElementById('app').innerHTML=`<header class="top"><div class="brand">${{A:'office <em>ritual</em>',D:'the daily <em>grind.</em>',C:'out & about ✳',E:'the coffee corner ♡'}[variant]}</div><nav><span>Design studio</span><span>One office. Good company.</span></nav><div class="row"><span class="pill">Private office</span><span class="avatar">NT</span></div></header><main class="wrap"><div class="intro"><div><div class="eyebrow">${isWarm?'The daily ritual':'A little office happiness'}</div><h1>${title}</h1>${subtitle?`<p class="muted">${subtitle}</p>`:''}</div>${screen==='runs'?'<button class="primary" data-screen="announce">+ Announce a run</button>':''}</div><nav class="tabs" aria-label="Prototype flow"><button data-screen="runs" aria-pressed="${screen==='runs'}">Open runs</button><button data-screen="menu" aria-pressed="${screen==='menu'}">Choose items</button><button data-screen="announce" aria-pressed="${screen==='announce'}">Announce</button><button data-screen="shopping" aria-pressed="${screen==='shopping'}">Runner’s list</button><button data-screen="assumptions" aria-pressed="${screen==='assumptions'}">Prototype notes</button></nav>${message?`<div class="toast" role="status">${esc(message)}</div>`:''}${screen==='runs'?(announced?`<div class="notice" style="margin-bottom:24px"><b>${esc(announced.title)}</b><br>${shopNames} · Closes in ${announced.minutes} minutes · Announced locally</div>`:'')+runs():screen==='menu'?menuView():screen==='announce'?announce():screen==='shopping'?shopping():assumptions()}<details class="state"><summary>Prototype state · illustrative, memory only</summary><pre>${esc(JSON.stringify(state,null,2))}</pre></details></main>`;document.getElementById('switcher').innerHTML=`<div class="prototype-switcher" aria-label="Visual direction"><button id="prev" aria-label="Previous direction">←</button><span>${variant} · ${names[variant]}<small>DESIGN EXPLORATION · ${variants.indexOf(variant)+1} OF 4</small></span><button id="next" aria-label="Next direction">→</button></div>`;}
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let focusLabel=b.getAttribute('aria-label');if(b.dataset.screen){screen=b.dataset.screen;message='';render();scrollTo(0,0)}else if(b.dataset.qty){let id=b.dataset.qty;quantities[id]=Math.max(0,(quantities[id]||0)+Number(b.dataset.delta));render();let match=[...document.querySelectorAll('button')].find(x=>x.getAttribute('aria-label')===focusLabel&&!x.disabled);match?.focus()}else if(b.dataset.minutes){closingMinutes=Number(b.dataset.minutes);render();document.querySelector(`[data-minutes="${closingMinutes}"]`).focus()}else if(b.id==='send'){submitted={...quantities};allCollected=false;message='Your sample request is with Mila. See it on the runner’s list.';render()}else if(b.id==='collect-all'){allCollected=true;message='Everything collected from both shops. You’re a legend.';render()}else if(b.id==='prev')cycle(-1);else if(b.id==='next')cycle(1)});
document.addEventListener('input',e=>{if(e.target.id==='closing-minutes')closingMinutes=e.target.value===''?'':Number(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id!=='announce-form')return;e.preventDefault();let f=new FormData(e.target),minutes=Number(f.get('minutes'));if(!Number.isInteger(minutes)||minutes<1||minutes>180)return;announced={title:generatedTitle(),minutes,shops:['Kiosk Coffee','Morning Bakery'],closesAt:new Date(Date.now()+minutes*60000).toISOString()};screen='runs';message='Run announced in this preview. No one has been notified.';render();scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
