let screen='runs',quantities={},submitted={},coffeeChoices={},allCollected=false,message='',closingMinutes=15;
const money=n=>n.toLocaleString('en')+' RSD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people='<div class="facepile" aria-label="Mila, Luka, Ana and four others"><span class="avatar">ML</span><span class="avatar">LK</span><span class="avatar">AN</span></div>';
function generatedTitle(d=new Date()){const hour=d.getHours(),period=hour<12?'morning':hour<18?'afternoon':'evening';const joke={morning:'Grounds for optimism',afternoon:'Crumbs of motivation',evening:'Better latte than never'}[period];return d.toLocaleDateString('en-GB',{weekday:'long'})+' '+period+' · '+joke;}
const shopNames='Kiosk Coffee + Morning Bakery';
let activeRun=params.get('demo')==='empty'?null:{name:generatedTitle(),person:'Mila',initials:'ML',minutes:15,count:7,sample:true};
const pastRuns=[{title:'Thursday afternoon · Crumbs of motivation',person:'Luka',count:6,date:'Yesterday · 14:30'},{title:'Thursday morning · Grounds for optimism',person:'Ana',count:9,date:'Yesterday · 09:15'}];
const keyFor=m=>m.coffee?m.id+':'+(coffeeChoices[m.id]||'Blend'):m.id;
function lines(source){return Object.entries(source).filter(([,qty])=>qty>0).map(([key,qty])=>{const [id,choice]=key.split(':');const item=menu.find(m=>m.id===id);return {...item,key,choice,qty};});}
const itemLabel=m=>m.name+(m.choice?' · '+m.choice:'');
function runs(){return `<div class="active-layout">${activeRun?`<article class="active-card" aria-label="Active run"><div class="active-label"><span class="eyebrow">The office’s one active run</span><span class="pill">${allCollected?'Collected':'Open'}</span></div><div class="postcard-art" aria-hidden="true">☕ ✳</div><div class="row between"><span class="eyebrow">From ${esc(activeRun.person)}, with caffeine</span><span class="stamp">${allCollected?'ALL<br>COLLECTED':activeRun.minutes+' MIN<br>TO JOIN'}</span></div><h2>${esc(activeRun.name)}</h2><p>${shopNames}</p><div class="row between">${people}<span class="caption">${activeRun.count} colleagues joining</span></div><button class="primary" data-screen="${allCollected?'shopping':'menu'}">${allCollected?'View the shopping list ↗':'Yes please! Choose items ↗'}</button></article>`:`<section class="empty-card"><span style="font-size:50px" aria-hidden="true">✳</span><h2>Who’s making the next good thing happen?</h2><p>No run on the go. Both shops are waiting.</p><button class="primary" style="margin-top:24px" data-screen="announce">I’ll make a run +</button></section>`}<aside class="active-aside"><div class="row between"><h3>${activeRun?'One run.<br>Lots of happy colleagues.':'Two stops.<br>A whole lot of love.'}</h3><span style="font-size:40px" aria-hidden="true">♡</span></div><p>Every run visits the coffee shop and the bakery.</p>${activeRun?'<p>There’s already a run on the go. Join this one — the next can start when it’s finished.</p><button class="secondary" disabled>A run is already active</button>':'<p>Pick how many minutes the office has to join. We’ll take care of the name.</p><button class="primary" data-screen="announce">Announce a run +</button>'}</aside></div><section class="past-runs" aria-label="Past runs"><div class="row between"><h2>Good runs, good memories.</h2><span class="history-symbol" aria-hidden="true">↶</span></div><p class="past-caption">Past runs · The little trips that made the office’s day.</p><div class="past-list">${pastRuns.map(r=>`<article class="past-run"><div class="row between"><span class="eyebrow">${r.date}</span><span class="pill">Completed</span></div><h3>${r.title}</h3><p>${r.person} brought back the good stuff for ${r.count} colleagues.</p><small>${shopNames}</small></article>`).join('')}</div></section>`;}
function menuView(){if(!activeRun)return '<div class="empty card"><h2>No active run yet.</h2><p>Announce a run to choose from both shop menus.</p><button class="primary" style="margin-top:20px" data-screen="announce">Announce a run</button></div>';if(allCollected)return '<div class="card"><h2>Everything has been collected.</h2><p style="margin-top:15px">This sample run is no longer taking requests.</p><button class="primary" style="margin-top:20px" data-screen="shopping">View shopping list</button></div>';return `<div class="sectionline"><div><h2>${esc(activeRun.name)}</h2><p class="muted" style="margin-top:8px">${esc(activeRun.person)}’s run · Closes in ${activeRun.minutes} min · Both shops</p></div></div><div class="menu-layout"><div>${['Kiosk Coffee','Morning Bakery'].map(shop=>`<section class="menu-shop"><h3>${shop}</h3>${menu.filter(m=>m.shop===shop).map(m=>{const key=keyFor(m),choice=coffeeChoices[m.id]||'Blend';return `<article class="option-item" aria-label="${m.name}"><div class="item-top"><div><b>${m.name}</b><br><small>${m.detail}</small></div><b style="font-size:13px;white-space:nowrap">${money(m.price)}</b></div><div class="item-bottom">${m.coffee?`<fieldset class="bean-choice"><legend>${m.name} coffee choice</legend><div class="bean-options">${['Blend','Specialty'].map(c=>`<label><input type="radio" name="choice-${m.id}" value="${c}" data-coffee="${m.id}" ${choice===c?'checked':''}><span>${c}</span></label>`).join('')}</div></fieldset>`:'<small>Ready as it comes</small>'}<div class="qty"><button aria-label="Remove ${m.name}${m.coffee?' '+choice:''}" data-qty="${key}" data-delta="-1" ${!quantities[key]?'disabled':''}>−</button><output aria-label="${m.name}${m.coffee?' '+choice:''} quantity">${quantities[key]||0}</output><button aria-label="Add ${m.name}${m.coffee?' '+choice:''}" data-qty="${key}" data-delta="1">+</button></div></div>${m.coffee?`<div class="selected-label">Quantity for ${choice.toLowerCase()} · Choose the other option to add that too.</div>`:''}</article>`}).join('')}</section>`).join('')}</div><aside class="card summary"><span class="eyebrow">For ${esc(activeRun.person)} to collect</span><h3 style="margin-top:12px">Your request</h3>${lines(quantities).map(m=>`<div class="summary-line"><span class="line-name">${m.qty} × ${esc(itemLabel(m))}</span><b>${money(m.qty*m.price)}</b></div>`).join('')||'<p class="muted">Pick something from the shop menus.</p>'}<div class="summary-line" style="border-top:1px solid var(--line);padding-top:16px"><b>Estimated total</b><b>${money(lines(quantities).reduce((t,m)=>t+m.qty*m.price,0))}</b></div><button class="primary" id="send" style="width:100%;margin-top:12px" ${!lines(quantities).length?'disabled':''}>Send request</button><div class="notice">Payment happens outside the app.</div><p><small>Sample menu and prices. Blend is preselected for this preview; actual defaults and specialty pricing are undecided.</small></p></aside></div>`;}
function announce(){if(activeRun)return `<section class="card form-shell"><span class="eyebrow">One run at a time</span><h2 style="margin-top:15px">The office already has a runner.</h2><p class="muted">${esc(activeRun.person)}’s run is still active. A new run can be announced when it’s finished.</p><button class="primary" style="margin-top:24px" data-screen="runs">Back to the active run ↗</button></section>`;return `<div class="form-shell card"><h2>You do the run. We do the naming.</h2><p class="muted">Both shops are on the route. How long does the office have to join?</p><form id="announce-form" class="stack" style="margin-top:26px"><div class="generated-title"><span class="eyebrow">Your automatically named run</span><h3>${esc(generatedTitle())}</h3><small>Day + time of day + a little coffee nonsense. No typing needed.</small></div><div class="notice" style="margin:0"><b>Two stops, every time</b><br>${shopNames}</div><label for="closing-minutes">Close requests in how many minutes?</label><div class="duration-input"><input id="closing-minutes" name="minutes" type="number" min="1" max="180" step="1" value="${closingMinutes}" required aria-describedby="duration-help"><span>minutes from now</span></div><div class="minute-presets" aria-label="Quick closing durations">${[5,10,15,30].map(n=>`<button type="button" data-minutes="${n}" aria-pressed="${closingMinutes===n}">${n} min</button>`).join('')}</div><p id="duration-help" class="form-feedback">Sample default: 15 minutes. The accepted range is illustrative.</p><button class="primary" type="submit">Announce to the office ↗</button><small>Preview only. No notifications are sent.</small></form></div>`;}
function shopping(){if(!activeRun)return '<div class="card"><h2>No active run to collect.</h2><p>The runner’s list appears when someone announces a run.</p></div>';let items=activeRun.sample?[{name:'Flat white',shop:'Kiosk Coffee',choice:'Blend',qty:3,for:'Mila × 1 · Ana × 2'},{name:'Iced latte',shop:'Kiosk Coffee',choice:'Specialty',qty:1,for:'Luka × 1'},{name:'Butter croissant',shop:'Morning Bakery',qty:4,for:'Mila × 1 · Ana × 1 · Luka × 2'}]:[];for(const m of lines(submitted)){const existing=items.find(i=>i.name===m.name&&i.choice===m.choice);if(existing){existing.qty+=m.qty;existing.for+=' · You × '+m.qty;}else items.push({...m,for:'You × '+m.qty});}const total=items.reduce((a,i)=>a+i.qty,0);return `<div class="sectionline"><div><h2>Everything to bring back</h2><p class="muted" style="margin-top:8px">Runner preview · ${esc(activeRun.name)}</p></div><span class="pill">2 shops · ${total} items</span></div><div class="collection-summary ${allCollected?'collection-done':''}"><div><h3 class="collection-heading">${allCollected?'All collected. Nice one!':'Coffee? Check. Pastries? Check.'}</h3><p>${allCollected?'Everything on this list is marked as collected.':'Glance through both shop lists, then mark everything in one go.'}</p></div><button class="primary" id="collect-all" ${allCollected||!items.length?'disabled':''}>${allCollected?'✓ Everything collected':'✓ Mark everything collected'}</button></div><div class="shop-list ${allCollected?'all-collected':''}">${['Kiosk Coffee','Morning Bakery'].map(shop=>`<section class="card"><span class="eyebrow">Shop stop</span><h2 style="margin:12px 0">${shop}</h2>${items.filter(i=>i.shop===shop).map(i=>`<div class="shopping-row"><div class="item-name"><div><b>${i.name}</b>${i.choice?` <span class="bean-tag">${i.choice}</span>`:''}</div><span class="item-count">× ${i.qty}</span></div><small>${i.for}</small></div>`).join('')||'<p class="muted">No items from this shop yet.</p>'}</section>`).join('')}</div><p class="notice">Collection is one action for both shops. Collected does not yet mean returned to the office; this run stays active in the preview.</p>`;}
function assumptions(){return `<section class="card help"><h2>Postcard Club · the chosen direction</h2><p>Peach and lavender postcards, soft green accents, bold rounded typography, chunky ink borders and playful stamps. One prominent active run; quieter completed runs below it.</p><h3>Confirmed in your feedback</h3><p>At most one run is active. Every run visits both shops. Titles are generated with a day, time of day and joke. Closing chips are 5, 10, 15 and 30 minutes. Every coffee has a blend/specialty choice; juices and hot chocolate do not. One action marks the whole collection.</p><h3>Illustrative details</h3><p>History placement below the active run is approved. Shops, people, history dates, RSD prices, menu contents, blend default, 15-minute default, 1–180 minute input range, exact jokes and time-of-day boundaries are examples. Coffee choices use equal sample prices; no specialty surcharge has been decided.</p><p>Sample countdowns are fixed for comparison. Titles use the browser clock; production timezone policy is undecided. The preview stops accepting requests after collection, but the complete lifecycle policy is still open. No backend, accounts, real notifications or persistence are connected.</p><h3>Design-system approach</h3><p>Carry these colours, typography, borders, spacing and shapes into shared design tokens and accessible React primitives. Keep native radios for coffee choices, semantic buttons and form labels. Document each production component and its states in Storybook; choose any extra library during delivery planning.</p><p><a href="frontend-comparison-prototype.html?variant=C">Earlier four-direction comparison (archived)</a></p></section>`;}
function render(){document.body.className='social postcards';const title={runs:'Good things come in runs.',menu:'A little something for you.',announce:'Heading out?',shopping:'The shopping list.',assumptions:'Behind the preview.'}[screen];const state={direction:'Postcard Club',screen,activeRun,requestDraft:quantities,coffeeChoices,submittedRequest:submitted,allCollected,closingMinutes};document.getElementById('app').innerHTML=`<header class="top"><div class="brand">out & about ✳</div><nav><span>Design studio</span><span>One office. Good company.</span></nav><div class="row"><span class="pill">Private office</span><span class="avatar">NT</span></div></header><main class="wrap"><div class="intro"><div><div class="eyebrow">A little office happiness</div><h1>${title}</h1>${screen==='runs'?'<p class="muted">Two stops. One office. Excellent taste.</p>':''}</div>${screen==='runs'&&!activeRun?'<button class="primary" data-screen="announce">+ Announce a run</button>':''}</div><nav class="tabs" aria-label="Prototype flow">${[['runs','Office runs'],['menu','Choose items'],['announce','Announce'],['shopping','Runner’s list'],['assumptions','Prototype notes']].map(([key,label])=>`<button data-screen="${key}" aria-pressed="${screen===key}">${label}</button>`).join('')}</nav>${message?`<div class="toast" role="status">${esc(message)}</div>`:''}${screen==='runs'?runs():screen==='menu'?menuView():screen==='announce'?announce():screen==='shopping'?shopping():assumptions()}<details class="state"><summary>Prototype state · illustrative, memory only</summary><pre>${esc(JSON.stringify(state,null,2))}</pre></details><aside class="demo-tools" aria-label="Prototype scenarios"><b>PROTOTYPE SCENARIOS · resets sample data</b><br><a href="?variant=C">One active run</a><a href="?variant=C&demo=empty">No active run / try announcing</a></aside></main>`;document.getElementById('switcher').innerHTML='';}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const focusLabel=b.getAttribute('aria-label');if(b.dataset.screen){screen=b.dataset.screen;message='';render();scrollTo(0,0);}else if(b.dataset.qty&&activeRun&&!allCollected){const key=b.dataset.qty;quantities[key]=Math.max(0,(quantities[key]||0)+Number(b.dataset.delta));render();[...document.querySelectorAll('button')].find(x=>x.getAttribute('aria-label')===focusLabel&&!x.disabled)?.focus();}else if(b.dataset.minutes){closingMinutes=Number(b.dataset.minutes);render();document.querySelector(`[data-minutes="${closingMinutes}"]`).focus();}else if(b.id==='send'&&activeRun&&!allCollected){submitted={...quantities};message='Your sample request is with '+activeRun.person+'. See it on the runner’s list.';render();}else if(b.id==='collect-all'&&activeRun){allCollected=true;message='Everything collected from both shops. You’re a legend.';render();}});
document.addEventListener('change',e=>{if(e.target.dataset.coffee){coffeeChoices[e.target.dataset.coffee]=e.target.value;const name=e.target.name,value=e.target.value;render();document.querySelector(`input[name="${name}"][value="${value}"]`).focus();}});
document.addEventListener('input',e=>{if(e.target.id==='closing-minutes')closingMinutes=e.target.value===''?'':Number(e.target.value);});
document.addEventListener('submit',e=>{if(e.target.id!=='announce-form')return;e.preventDefault();if(activeRun)return;const minutes=Number(new FormData(e.target).get('minutes'));if(!Number.isInteger(minutes)||minutes<1||minutes>180)return;activeRun={name:generatedTitle(),person:'You',initials:'NT',minutes,count:0,sample:false,closesAt:new Date(Date.now()+minutes*60000).toISOString()};screen='runs';message='Run announced in this preview. No one has been notified.';render();scrollTo(0,0);});render();
</script></html>
