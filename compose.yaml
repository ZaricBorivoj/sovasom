services:
  db:
    image: postgres:19.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U office -d office']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
    secrets: [database_url]
    networks: [data, edge]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
  backend-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://office:synthetic-tests-only@db/office
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
secrets:
  database_password:
    file: ${OFFICE_SECRETS_DIR:?Set OFFICE_SECRETS_DIR outside the checkout}/database_password
  database_url:
    file: ${OFFICE_SECRETS_DIR:?Set OFFICE_SECRETS_DIR outside the checkout}/database_url
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  edge:
  data:
    internal: true
