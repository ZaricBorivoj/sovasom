name: Verify infrastructure
on:
  push:
    paths: ['infra/**', 'scripts/configure-corporate-ca.sh', 'backend/tests/test_corporate_ca.py', '.github/workflows/infrastructure-*.yml', '.tool-versions']
  pull_request:
    paths: ['infra/**', 'scripts/configure-corporate-ca.sh', 'backend/tests/test_corporate_ca.py', '.github/workflows/infrastructure-*.yml', '.tool-versions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        root: [foundation, application]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: infra/${{ matrix.root }}
      - run: terraform validate -no-color
        working-directory: infra/${{ matrix.root }}
      - name: Isolated plans with synthetic AWS provider
        run: terraform test -no-color
        working-directory: infra/${{ matrix.root }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - name: Destroy protection and state ownership with synthetic local state
        run: uv run --no-project --python 3.15.2 python infra/check_teardown.py --root '${{ matrix.root }}'
      - name: Corporate CA onboarding with disposable shell profiles
        run: uv run --frozen pytest backend/tests/test_corporate_ca.py
