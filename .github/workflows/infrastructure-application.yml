name: Manage application infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        description: Plan or apply the disposable application root
permissions:
  contents: read
concurrency:
  group: application-infrastructure
  cancel-in-progress: false
jobs:
  application:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_backup_bucket_name: ${{ vars.BACKUP_BUCKET_NAME }}
      TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
      TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
      TF_VAR_public_ipv4: ${{ vars.PUBLIC_IPV4 }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra/application
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - name: Require setup configuration
        run: |
          test -n "$TF_VAR_aws_account_id"
          test -n "$TF_VAR_backup_bucket_name"
          test -n "$TF_VAR_hosted_zone_id"
          test -n "$TF_VAR_app_hostname"
          test -n "$TF_VAR_public_ipv4"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ vars.INFRASTRUCTURE_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
      - name: Verify configuration and isolated tests
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform fmt -check
          terraform validate
          terraform test -no-color
      - name: Initialize locked remote application state
        run: >-
          terraform init -reconfigure -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config='key=application/terraform.tfstate'
          -backend-config='region=eu-central-1'
          -backend-config='encrypt=true'
          -backend-config='use_lockfile=true'
          -backend-config='workspace_key_prefix=application/workspaces'
      - name: Plan current main
        run: |
          umask 077
          terraform plan -lock-timeout=5m -out="$RUNNER_TEMP/application.tfplan" -no-color
      - name: Apply this job's plan
        if: inputs.operation == 'apply'
        run: terraform apply -lock-timeout=5m -no-color "$RUNNER_TEMP/application.tfplan"
      - name: Remove local plan and backend metadata
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/application.tfplan"
          rm -rf .terraform
